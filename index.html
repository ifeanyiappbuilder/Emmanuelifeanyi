<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>FOOD TO IMAGINE</title>
</head>

<body>

<header class="header"> 
   <div class="logo">
     <span class="logo-icon">🍽️</span>
     <span class="logo-text">FOOD TO IMAGINE</span>
   </div>

   <nav class="nav" id="nav">
      <a href="Home.html" class="nav-link">Home</a>
      <a href="Recommended.html" class="nav-link">Good Dishes</a>
      <a href="Ingredients.html" class="nav-link">List of Ingredients</a>
   </nav>

   <button aria-label="hamburger" class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
   </button>
</header>

<section class="hero">
  <h1 class="hero-title">
    Discover & Save <span>Delicious recipes</span>
  </h1>
  <p class="hero-subtitle">
    Cook smart. Eat clean. Live better.
  </p>
</section>

<main class="main">

  <div class="control">
    <input type="text" class="search-input" id="searchInput" placeholder="Search for recipes">

    <select id="categoryFilter" class="category-select">
      <option value="all">All</option>
      <option value="breakfast">Breakfast</option>
      <option value="lunch">Lunch</option>
      <option value="dinner">Dinner</option>
      <option value="snack">Snack</option>
      <option value="dessert">Dessert</option>
    </select>

    <!-- FIXED ID -->
    <button class="btn-add" id="openFormBtn">Add Recipes</button>
  </div>

  <div class="recipe-grid" id="recipeGrid"></div>

</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    <button class="modal-close" id="modalClose">✕</button>
    <h2>Add New Recipe</h2>

    <div class="form-group">
      <label>Recipe Name</label>
      <input type="text" id="recipeName">
    </div>

    <div class="form-group">
      <label>Category</label>
      <select id="recipeCategory">
        <option value="breakfast">Breakfast</option>
        <option value="lunch">Lunch</option>
        <option value="dinner">Dinner</option>
        <option value="snack">Snack</option>
        <option value="dessert">Dessert</option>
      </select>
    </div>

    <div class="form-group">
      <label>Cuisine</label>
      <input type="text" id="recipeCuisine">
    </div>

    <div class="form-group">
      <label>Ingredients (one per line)</label>
      <textarea id="recipeIngredients" rows="5"></textarea>
    </div>

    <div class="form-group">
      <label>Instructions</label>
      <textarea id="recipeInstructions" rows="4"></textarea>
    </div>

    <div class="form-group">
      <label>Emoji (optional)</label>
      <input type="text" id="recipeEmoji">
    </div>

    <button class="btn-submit" id="saveRecipeBtn">Save Recipe</button>

  </div>
</div>

<!-- SHOPPING PANEL (FIXED POSITION) -->
<div class="shopping-panel" id="shoppingPanel">
  <h2>Shopping List</h2>
  <div id="shoppingItems"></div>
  <button id="closeShoppingPanel">Close</button>
</div>

<!-- JS FILE (IMPORTANT: OUTSIDE EVERYTHING) -->
<script src="js/app.js"></script>

</body>
</html>
